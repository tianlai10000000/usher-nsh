[package]
name = "usher-nsh"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/tianlai10000000/usher"
authors = ["yuankai <tanlai10000000@gmail.com>"]
license = "LicenseRef-Proprietary"
publish = false

[workspace]
members = [".", "crates/usher-state", "crates/usher-router", "crates/usher-test-support", "crates/usher-update", "crates/usher-logging"]
default-members = ["."]
resolver = "3"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
nsh-core = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
usher-logging = { path = "crates/usher-logging" }
usher-update = { path = "crates/usher-update" }
usher-router = { path = "crates/usher-router", features = ["matcher-matchit"] }
usher-state = { path = "crates/usher-state", features = ["backend-watch"] }

[dev-dependencies]
usher-test-support = { path = "crates/usher-test-support" }

[[test]]
name = "update_state"
path = "tests/integration/update_state.rs"

[[test]]
name = "state_router"
path = "tests/integration/state_router.rs"

[[test]]
name = "settings_state"
path = "tests/integration/settings_state.rs"

[[test]]
name = "diagnostics"
path = "tests/integration/diagnostics.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
nsh-platform-macos = { version = "=0.5.0", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSImage",
    "NSImageView",
    "NSImageCell",
    "NSPopUpButton",
    "NSSegmentedCell",
    "NSSegmentedControl",
] }
