[package]
name = "usher-update"
version = "0.0.1-alpha.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

# Pure logic only: no NSH, no UI and no network client. Keeping it that small is what
# makes `cargo test -p usher-update` fast, and lets the app crate depend on it without
# recompiling the signing and version code every time the UI side changes.
[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
