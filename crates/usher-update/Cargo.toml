[package]
name = "usher-update"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

# Pure logic only: no NSH, no UI, no I/O. Keeping it that small is what makes
# `cargo test -p usher-update` fast and lets the application crate depend on it without
# recompiling anything else when the UI side changes.
[dependencies]
semver = "1"
