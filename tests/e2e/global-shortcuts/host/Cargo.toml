# Isolated global shortcut catalog and native registration oracle, never a production dependency.
[package]
name = "usher-global-shortcut-tests"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
usher-nsh = { path = "../../../.." }
nsh-core = "=0.5.0"
serde_json = "1"
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
