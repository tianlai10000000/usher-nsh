name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_state:
        description: Run isolated state, routing and update launch acceptance on an unlocked macOS desktop runner
        type: boolean
        default: false
      native_shortcut_input:
        description: Also run real background key input (requires native_state and preauthorized Usher Shortcut Input)
        type: boolean
        default: false

# Read-only by default: a job that needs more asks for it by name.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The Rust toolchain every job builds with. The NSH command line is not set here: the
  # installer reads its version from Cargo.toml, so there is nothing to keep in step.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  state:
    name: State, router and shortcut contracts without NSH
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Test the shared test helpers
        run: python3 scripts/test.py test-support

      - name: Test both state backends
        run: python3 scripts/test.py state

      - name: Test router contracts and generated route contracts
        run: |
          python3 scripts/test.py router
          python3 scripts/test.py routes-check

      - name: Test and lint the dependency-free shortcut contracts
        run: |
          python3 scripts/test.py shortcuts
          cargo clippy --locked -p usher-shortcuts --all-targets -- -D warnings

      - name: Lint the router matcher
        run: cargo clippy --locked -p usher-router --all-targets --features matcher-matchit -- -D warnings

      - name: Lint the optional watch backend
        run: cargo clippy --locked -p usher-state --all-targets --features backend-watch -- -D warnings

      - name: Install configured pure Rust compilation targets
        shell: python
        run: |
          import json, subprocess
          config = json.load(open('tests/config.json'))
          targets = config['platform_compile']['targets']
          subprocess.run(['rustup', 'target', 'add', *targets], check=True)

      - name: Compile state and domain libraries for the platform matrix
        run: python3 scripts/test.py state-targets

      - name: Preserve contract and compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-contract-evidence
          path: target/test-reports/

  rust:
    name: Rust format, lint, test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The update crate is pure logic: it must build and pass on its own, without NSH.
      - name: Test the update crate in isolation
        run: cargo test --locked -p usher-update

      - name: Test logging rules and mock backend contracts
        run: |
          python3 scripts/test.py logging
          python3 scripts/test.py logging-mock

      - name: Test the application crate
        run: cargo test --locked --lib

      - name: Validate application shortcut modules and NSH normalization
        run: python3 scripts/test.py shortcuts-app

      - name: Test settings, window and update application integration
        run: python3 scripts/test.py integration

  ui:
    name: NSH type check and UI tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ui-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ui-${{ env.RUST_TOOLCHAIN }}-

      - name: Install the NSH CLI
        run: bash scripts/ci/install-nsh.sh

      - name: Type check
        run: nsh check

      - name: State projection and subscription bridge tests
        run: python3 scripts/test.py state-ui

      - name: Router facade and real bridge tests
        run: python3 scripts/test.py router-ui

      - name: Headless application journeys
        run: python3 scripts/test.py e2e --target headless

      - name: Shortcut controller and isolated bridge journeys
        run: |
          python3 scripts/test.py shortcuts-ui
          python3 scripts/test.py shortcuts-headless

      - name: UI tests
        run: python3 scripts/test.py ui

  native-state:
    name: Native state, routing and update acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.native_state
    runs-on: [self-hosted, macOS, usher-native]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the NSH CLI
        run: bash scripts/ci/install-nsh.sh
      - name: Isolated native windows and real HMR
        run: python3 scripts/test.py e2e --target macos
      - name: Isolated native shortcut journey
        run: python3 scripts/test.py shortcuts-macos
      - name: Isolated global shortcut registration
        run: python3 scripts/test.py global-shortcuts-macos
      - name: Real background system shortcut input
        if: inputs.native_shortcut_input
        run: python3 scripts/test.py global-shortcuts-input-macos
      - name: Full native VM reload
        run: python3 scripts/test.py native-reload
      - name: Isolated packaged URL registration and launch
        run: python3 scripts/test.py packaged-routing
      - name: Isolated local update launch scenarios
        run: scripts/update-sim/sim.sh run --all
      - name: Real whole-app archive replacement and failure recovery
        run: python3 scripts/test.py shell-update
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-state-evidence
          path: target/test-reports/

  scripts:
    name: Release scripts and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      # Every file Rust embeds must be a listed shell input, or a TSX-only release could ship a
      # code package to an app whose binary still holds the old copy.
      - name: Check the shell input list is complete
        run: python3 scripts/release/shell_inputs.py check-embedded

      # The pre-commit checks are what keep unformatted code out of a commit, so they are tested
      # here: hooks that quietly stop working would only show up as a failed CI later.
      - name: Install lefthook, shellcheck and actionlint
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mkdir -p "$HOME/.local/bin"
          (cd "$HOME/.local/bin" && bash "$GITHUB_WORKSPACE/scripts/ci/install-lefthook.sh")
          (cd "$HOME/.local/bin" && bash "$GITHUB_WORKSPACE/scripts/ci/install-actionlint.sh")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustup component add rustfmt

      # A lefthook.yml that does not parse writes no hook at all and nothing says so.
      - name: Validate the lefthook config
        run: lefthook validate

      - name: Pre-commit hook tests
        run: bash scripts/tests/test_git_hooks.sh

      - name: Lint workflows and shell scripts
        run: |
          set -euo pipefail
          actionlint -color
          shellcheck scripts/ci/*.sh scripts/*.sh scripts/git-hooks/*.sh scripts/tests/*.sh scripts/update-sim/*.sh
